[package]
name = "caudal-native"
description = "UI egui para Windows y Android."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "caudal"
path = "src/main.rs"

[dependencies]
caudal-app-state.workspace = true
caudal-store-sqlite.workspace = true
chrono = { workspace = true, features = ["clock"] }
eframe.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
uuid = { workspace = true, features = ["v4"] }
png = "0.18"
egui_extras = { version = "0.37", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.17"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-game-activity"] }
jni = "0.21"
