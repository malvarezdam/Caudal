[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
caudal-core = { path = "crates/core" }
caudal-sync = { path = "crates/sync" }
caudal-supabase = { path = "crates/supabase" }
caudal-store-sqlite = { path = "crates/store-sqlite" }
caudal-store-idb = { path = "crates/store-idb" }
caudal-app-state = { path = "crates/app-state" }

rust_decimal = { version = "1.43", features = ["serde-str"] }
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["alloc", "serde"] }
uuid = { version = "1", features = ["serde"] }
thiserror = "2"
reqwest = { version = "0.13", features = ["json"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rexie = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "android-game-activity"] }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }

[profile.release]
lto = "thin"
strip = true

[profile.release.package."*"]
opt-level = 3