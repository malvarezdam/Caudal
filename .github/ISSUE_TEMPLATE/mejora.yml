name: Proponer una mejora
description: Una función nueva o un cambio en una existente.
labels: ["mejora"]
body:
  - type: textarea
    id: need
    attributes:
      label: Qué necesitas
      description: El problema que resolvería, antes que la solución.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Cómo lo imaginas
  - type: markdown
    attributes:
      value: "Caudal registra y muestra tu dinero: no da recomendaciones de inversión ni ejecuta pagos u operaciones."
