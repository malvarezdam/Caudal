name: Precios

# Dos veces al día: tras el cierre de Nueva York y por la mañana en Europa,
# con Asia ya cerrada. Las criptos y las divisas se actualizan en ambas.
on:
  schedule:
    - cron: "20 22 * * *"
    - cron: "30 9 * * *"
  workflow_dispatch:

# Nunca dos ejecuciones a la vez: cada símbolo se consulta una sola vez.
concurrency:
  group: precios
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: price-worker
      - run: cargo build --release -p caudal-price-worker
      # Si una fuente entera falla, el paso termina con error y GitHub avisa por correo.
      - run: ./target/release/caudal-price-worker
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
